<div id="game-world" class="relative min-h-screen w-full overflow-hidden bg-green-900"
  (mousedown)="handleMouseDown($event)" (mouseup)="handleMouseUp($event)">

  <!-- Player -->
  <app-player (shoot)="shootProjectile($event)" (attack)="playerAttack()"></app-player>

  <!-- Projectiles -->
  <div id="projectile-layer" class="pointer-events-none absolute inset-0"></div>

  <!-- Enemy -->
  <app-enemy></app-enemy>

</div>
