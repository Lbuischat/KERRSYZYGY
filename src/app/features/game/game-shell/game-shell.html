<div class="relative min-h-screen w-full">

  <app-game-world />

  <app-hud
    (settingsOpen)="openSettings()"
    (inventoryOpen)="toggleInventory()"
  />

  @if (settingsOpen) {
    <app-settings
      [class]="'settings-host' + (settingsClosing ? ' settings-closing' : '')"
      (closeSettings)="closeSettings()"
    />
  }

  @if (inventoryOpen) {
    <app-inventory />
  }

</div>
