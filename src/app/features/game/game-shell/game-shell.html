<div class="relative min-h-screen w-full">

  <app-game-world />

  <app-hud
    (settingsOpen)="openSettings()"
    (inventoryOpen)="toggleInventory()"
  />

  @if (inventoryOpen) {
    <app-inventory />
  }

  <app-game-tutorial
    [open]="tutorialOpen"
    (finished)="completeTutorial()"
  />

</div>
