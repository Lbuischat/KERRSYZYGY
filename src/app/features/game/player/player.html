<div id="player" class="absolute">

  <!-- Health -->
  <div
    id="player-health-container"
    class="absolute bottom-full left-1/2 mb-3 h-2 w-10 -translate-x-1/2 overflow-hidden rounded-full bg-black/50"
  >
    <div
      id="player-health-bar"
      class="h-full bg-red-500"
      style="width: 100%"
    ></div>
  </div>

  <!-- Stamina -->
  <div
    id="stamina-container"
    class="absolute bottom-full left-1/2 mb-1 hidden h-2 w-10 -translate-x-1/2 overflow-hidden rounded-full bg-black/50"
  >
    <div
      id="stamina-bar"
      class="h-full bg-yellow-400"
      style="width: 100%"
    ></div>
  </div>

  <!-- Player -->
  <div
    id="player-character"
    class="h-10 w-10 rounded bg-red-500"
  ></div>

</div>
