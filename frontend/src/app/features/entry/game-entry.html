<div
    class="game-entry"
    [class.transitioning]="isTransitioning()"
    [class.login-visible]="showLogin()">

    <div class="title-layer">
        <app-title
            #title
            (remember)="enterLogin()">
        </app-title>
    </div>

    <div class="login-layer">
        <app-login></app-login>
    </div>

</div>

<div class="language-container">

    <button
        type="button"
        class="language-button"
        (click)="toggleLanguages()">

        🌐 {{ currentLanguageLabel() }}

    </button>

    @if (showLanguages()) {

        <div class="language-menu">

            <button
                type="button"
                (click)="changeLanguage('en')">

                {{ languageService.t().language.english }}

            </button>

            <button
                type="button"
                (click)="changeLanguage('pt')">

                {{ languageService.t().language.portuguese }}

            </button>

            <button
                type="button"
                (click)="changeLanguage('es')">

                {{ languageService.t().language.spanish }}

            </button>

            <button
                type="button"
                (click)="changeLanguage('fr')">

                {{ languageService.t().language.french }}

            </button>

            <button
                type="button"
                (click)="changeLanguage('de')">

                {{ languageService.t().language.german }}

            </button>

        </div>

    }

</div>
