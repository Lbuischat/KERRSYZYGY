<!-- TASK PANEL -->

<div class="task-panel">

  <!-- HEADER -->
  <div class="task-header">

    <div>
      <span class="task-kicker">
        DAILY OBJECTIVES
      </span>

      <h2>
        Tasks
      </h2>
    </div>

    <span class="task-count">
      {{ tasks.length }}
    </span>

  </div>


  <!-- TASK LIST -->
  <div class="task-list">

    @for (task of tasks; track task.id) {

    <button type="button" class="task-item" [class.completed]="task.completed" (click)="completeTask(task)">

      <!-- ICON -->
      <span class="task-icon">
        {{ task.icon }}
      </span>


      <!-- TASK INFORMATION -->
      <span class="task-info">

        <span class="task-name">
          {{ task.name }}
        </span>

        <span class="task-reward">
          +{{ task.reward }} XP
        </span>

      </span>


      <!-- COMPLETION / ARROW -->
      <span class="task-arrow">

        @if (task.completed) {
        ✓
        } @else {
        ›
        }

      </span>

    </button>

    }

  </div>


  <!-- FOOTER / PROGRESS -->
  <div class="task-footer">

    <span>
      COMPLETION
    </span>


    <div class="task-progress">

      <div class="task-progress-bar" [style.width.%]="taskProgress"></div>

    </div>


    <span>
      {{ completedTasks }} / {{ tasks.length }}
    </span>

  </div>

</div>
