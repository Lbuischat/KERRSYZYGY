
<div
  id="game-world"
  class="relative h-screen w-full overflow-hidden bg-green-900"
  (mousedown)="handleMouseDown($event)"
  (mouseup)="handleMouseUp($event)"
>

  <!-- CÂMERA E MAPA -->
  <div id="camera">

    <div id="map-background"></div>

    <!-- ARBUSTOS -->
    @for (bush of bushes(); track bush.id) {
      <app-bush
        [x]="bush.column * 128"
        [y]="bush.row * 128"
        [harvested]="bush.harvested"
      />
    }

    <!-- JOGADOR ORIGINAL -->
    <app-player
      (shoot)="shootProjectile($event)"
      (attack)="playerAttack()"
      (interact)="playerInteract()"
    />

    <!-- CAMADA DE PROJÉTEIS -->
    <div
      id="projectile-layer"
      class="pointer-events-none"
    ></div>

    <!-- CINCO INIMIGOS -->
    @for (spawn of enemySpawns; track spawn.id) {
      <app-enemy
        [x]="spawn.x"
        [y]="spawn.y"
        [elite]="spawn.elite"
        [training]="spawn.training"
      />
    }

  </div>

  <!-- ==================================
       GAME OVER
  =================================== -->

  @if (gameOver()) {

    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="game-over-title"
      style="
        position: fixed;
        inset: 0;
        z-index: 999999;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: rgba(5, 6, 18, 0.9);
        backdrop-filter: blur(8px);

        pointer-events: auto;
      "
      (mousedown)="$event.stopPropagation()"
      (mouseup)="$event.stopPropagation()"
      (click)="$event.stopPropagation()"
    >

      <section
        style="
          box-sizing: border-box;

          width: min(460px, 100%);
          padding: 44px 28px;

          text-align: center;

          border: 1px solid rgba(166, 143, 255, 0.65);
          border-radius: 18px;

          background: linear-gradient(
            145deg,
            #19152e,
            #0b0d1b
          );

          box-shadow:
            0 20px 70px rgba(0, 0, 0, 0.7),
            0 0 35px rgba(128, 100, 255, 0.08);

          color: #ffffff;
        "
      >

        <!-- SÍMBOLO -->
        <div
          aria-hidden="true"
          style="
            margin-bottom: 12px;
            color: #aa9bff;
            font-size: 47px;
            text-shadow: 0 0 22px rgba(160,140,255,.6);
          "
        >
          ✦
        </div>

        <!-- NOME DO JOGO -->
        <span
          style="
            color: #a99be8;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.35em;
          "
        >
          KERRSYZYGY
        </span>

        <!-- TÍTULO -->
        <h2
          id="game-over-title"
          style="
            margin: 18px 0;

            font-family: Georgia, serif;
            font-size: clamp(34px, 6vw, 48px);
            font-weight: 400;

            letter-spacing: 0.04em;
          "
        >
          VOCÊ MORREU
        </h2>

        <!-- MENSAGEM -->
        <p
          style="
            max-width: 320px;

            margin: 0 auto 30px;

            color: #b2afc7;
            font-size: 14px;
            line-height: 1.8;
          "
        >
          Até as estrelas mais brilhantes
          podem se apagar.

          Sua jornada ainda não terminou.
        </p>

        <!-- REINICIAR -->
        <button
          type="button"
          (click)="restartGame()"
          style="
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            min-height: 50px;
            padding: 14px 30px;

            border: 1px solid #a494ff;
            border-radius: 10px;

            background: linear-gradient(
              135deg,
              #7362d9,
              #493a8c
            );

            box-shadow:
              0 0 20px rgba(128,100,255,.24);

            color: white;

            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.09em;

            cursor: pointer;
          "
        >
          <span
            aria-hidden="true"
            style="font-size: 21px"
          >
            ↻
          </span>

          REINICIAR JOGO
        </button>

        <p
          style="
            margin: 24px 0 0;
            color: #9692b3;
            font-size: 11px;
          "
        >
          XP, créditos e missões serão mantidos.
        </p>

      </section>

    </div>
  }

</div>
