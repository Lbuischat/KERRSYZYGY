
<div id="player">

  <!-- VIDA -->
  <div id="player-health-container">
    <div
      id="player-health-bar"
      style="width: 100%"
    ></div>
  </div>

  <!-- STAMINA -->
  <div id="stamina-container">
    <div
      id="stamina-bar"
      style="width: 100%"
    ></div>
  </div>

  <!-- PERSONAGEM -->
  <div id="player-character" class="pixel-character">

    <svg
      class="player-sprite"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 48"
      shape-rendering="crispEdges"
      role="img"
      aria-label="Personagem do jogador"
    >

      <!-- SOMBRA -->
      <rect x="8" y="45" width="24" height="2"
            fill="#101628" opacity=".45"/>

      <!-- CAPA -->
      <path
        d="M12 25H28L33 42H7Z"
        fill="#192035"
      />
      <path
        d="M12 25H28L32 41H8Z"
        fill="var(--sprite-cape, #142d40)"
      />

      <!-- BOTAS -->
      <rect x="11" y="38" width="8" height="7"
            fill="#15192d"/>
      <rect x="21" y="38" width="8" height="7"
            fill="#15192d"/>

      <rect x="10" y="43" width="10" height="2"
            fill="var(--sprite-accent, #80d9ff)"/>
      <rect x="20" y="43" width="10" height="2"
            fill="var(--sprite-accent, #80d9ff)"/>

      <!-- PERNAS -->
      <rect x="12" y="34" width="7" height="7"
            fill="var(--sprite-dark, #192c43)"/>
      <rect x="21" y="34" width="7" height="7"
            fill="var(--sprite-dark, #192c43)"/>

      <!-- BRAÇOS -->
      <rect x="5" y="27" width="7" height="12"
            fill="#192035"/>
      <rect x="28" y="27" width="7" height="12"
            fill="#192035"/>

      <rect x="6" y="28" width="6" height="8"
            fill="var(--sprite-outfit, #26435e)"/>
      <rect x="28" y="28" width="6" height="8"
            fill="var(--sprite-outfit, #26435e)"/>

      <!-- MÃOS -->
      <rect x="6" y="36" width="6" height="4"
            fill="var(--sprite-skin, #b87959)"/>
      <rect x="28" y="36" width="6" height="4"
            fill="var(--sprite-skin, #b87959)"/>

      <!-- TRONCO -->
      <rect x="11" y="25" width="18" height="14"
            fill="#191e35"/>

      <rect x="13" y="27" width="14" height="10"
            fill="var(--sprite-outfit, #26435e)"/>

      <!-- OMBREIRAS -->
      <rect x="10" y="27" width="5" height="4"
            fill="var(--sprite-accent, #80d9ff)"/>
      <rect x="25" y="27" width="5" height="4"
            fill="var(--sprite-accent, #80d9ff)"/>

      <!-- GOLA -->
      <rect x="15" y="26" width="10" height="3"
            fill="var(--sprite-dark, #192c43)"/>

      <rect x="16" y="26" width="8" height="1"
            fill="var(--sprite-accent, #80d9ff)"/>

      <!-- CINTO -->
      <rect x="12" y="36" width="16" height="3"
            fill="#171a30"/>

      <rect x="18" y="36" width="4" height="3"
            fill="#f8d88d"/>

      <!-- EMBLEMA ESTELAR -->
      <rect x="18" y="30" width="4" height="6"
            fill="var(--sprite-accent, #80d9ff)"/>

      <rect x="16" y="32" width="8" height="2"
            fill="var(--sprite-accent, #80d9ff)"/>

      <rect x="19" y="32" width="2" height="2"
            fill="#ffffff"/>

      <!-- PESCOÇO -->
      <rect x="16" y="23" width="8" height="5"
            fill="var(--sprite-skin, #b87959)"/>

      <!-- CABEÇA: CONTORNO -->
      <rect x="12" y="9" width="16" height="18"
            fill="#20243b"/>
      <rect x="10" y="13" width="20" height="10"
            fill="#20243b"/>

      <!-- ORELHAS -->
      <rect x="9" y="17" width="4" height="6"
            fill="var(--sprite-skin, #b87959)"/>
      <rect x="27" y="17" width="4" height="6"
            fill="var(--sprite-skin, #b87959)"/>

      <!-- ROSTO -->
      <rect x="13" y="12" width="14" height="13"
            fill="var(--sprite-skin, #b87959)"/>

      <rect x="15" y="25" width="10" height="2"
            fill="var(--sprite-skin, #b87959)"/>

      <!-- CABELO -->
      <rect x="12" y="7" width="16" height="8"
            fill="var(--sprite-hair, #192237)"/>

      <rect x="14" y="5" width="12" height="4"
            fill="var(--sprite-hair, #192237)"/>

      <rect x="10" y="11" width="5" height="7"
            fill="var(--sprite-hair, #192237)"/>

      <rect x="25" y="11" width="5" height="7"
            fill="var(--sprite-hair, #192237)"/>

      <!-- FRANJA -->
      <rect x="15" y="13" width="5" height="2"
            fill="var(--sprite-hair, #192237)"/>

      <rect x="23" y="12" width="3" height="3"
            fill="var(--sprite-hair, #192237)"/>

      <!-- OLHOS GRANDES CARTOON -->
      <rect x="15" y="17" width="4" height="5"
            fill="#19203b"/>

      <rect x="22" y="17" width="4" height="5"
            fill="#19203b"/>

      <rect x="15" y="17" width="2" height="2"
            fill="#ffffff"/>

      <rect x="22" y="17" width="2" height="2"
            fill="#ffffff"/>

      <!-- BOCHECHAS -->
      <rect x="13" y="22" width="3" height="2"
            fill="#f59eaa" opacity=".6"/>

      <rect x="25" y="22" width="2" height="2"
            fill="#f59eaa" opacity=".6"/>

      <!-- SORRISO -->
      <rect x="18" y="24" width="4" height="1"
            fill="#70435e"/>

      <!-- ACESSÓRIO EXPLORADOR -->
      <g class="accessory-explorer">
        <rect x="12" y="13" width="16" height="3"
              fill="#243247"/>
        <rect x="13" y="13" width="5" height="3"
              fill="#8beaff"/>
        <rect x="22" y="13" width="5" height="3"
              fill="#8beaff"/>
        <rect x="14" y="13" width="2" height="1"
              fill="#ffffff"/>
      </g>

      <!-- ACESSÓRIO ORÁCULO -->
      <g class="accessory-oracle">
        <rect x="11" y="8" width="18" height="5"
              fill="var(--sprite-cape, #29234f)"/>
        <rect x="10" y="12" width="3" height="7"
              fill="var(--sprite-cape, #29234f)"/>
        <rect x="27" y="12" width="3" height="7"
              fill="var(--sprite-cape, #29234f)"/>
        <rect x="19" y="8" width="2" height="4"
              fill="#e9ddff"/>
        <rect x="18" y="9" width="4" height="2"
              fill="#bda6ff"/>
      </g>

      <!-- ACESSÓRIO GUARDIÃO -->
      <g class="accessory-guardian">
        <rect x="12" y="8" width="16" height="5"
              fill="#d09b4a"/>
        <rect x="15" y="5" width="10" height="4"
              fill="#f8d184"/>
        <rect x="19" y="3" width="2" height="4"
              fill="#fff1b7"/>
        <rect x="18" y="9" width="4" height="3"
              fill="#fff7da"/>
      </g>

      <!-- ACESSÓRIO CAÇADOR -->
      <g class="accessory-hunter">
        <rect x="11" y="15" width="18" height="3"
              fill="#16434b"/>
        <rect x="13" y="17" width="14" height="3"
              fill="#16243d"/>
        <rect x="14" y="17" width="5" height="2"
              fill="#71e1c6"/>
        <rect x="21" y="17" width="5" height="2"
              fill="#71e1c6"/>
      </g>

      <!-- ACESSÓRIO TEMPORAL -->
      <g class="accessory-chrono">
        <rect x="13" y="7" width="14" height="3"
              fill="#f3a3d5"/>
        <rect x="11" y="5" width="3" height="5"
              fill="#c58bf3"/>
        <rect x="26" y="5" width="3" height="5"
              fill="#c58bf3"/>
        <rect x="19" y="4" width="2" height="6"
              fill="#fff1fe"/>
      </g>
    </svg>
  </div>
</div>
