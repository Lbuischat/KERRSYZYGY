<div class="inventory">

  <!-- FILTERS -->
  <div class="filters">

    <button
      id="all"
      [class.active]="activeFilter === 'all'"
      (click)="selectFilter('all')"
    >
      All
    </button>

    <button
      [class.active]="activeFilter === 'weapons'"
      (click)="selectFilter('weapons')"
    >
      Weapons
    </button>

    <button
      [class.active]="activeFilter === 'armor'"
      (click)="selectFilter('armor')"
    >
      Armor
    </button>

    <button
      [class.active]="activeFilter === 'potions'"
      (click)="selectFilter('potions')"
    >
      Potions
    </button>

    <button
      [class.active]="activeFilter === 'items'"
      (click)="selectFilter('items')"
    >
      Items
    </button>

    <button
      [class.active]="activeFilter === 'collectables'"
      (click)="selectFilter('collectables')"
    >
      Collectables
    </button>

  </div>


  <!-- INVENTORY GRID -->
  <div class="inventory-grid">

    @for (slot of slots; track $index) {
      <button class="inventory-item"></button>
    }

  </div>

  <!-- SELECTED ITEM -->
  <div class="inventory-selected">
  </div>

</div>

<!-- OVERLAY -->
<div class="overlay"></div>
