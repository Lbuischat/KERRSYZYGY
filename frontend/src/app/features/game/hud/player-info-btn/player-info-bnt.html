<button class="player-card" type="button" (click)="openProfile()">

  <div class="player-details">

    <!-- PLAYER AVATAR -->
    <div class="player-avatar">
      👤
    </div>

    <!-- PLAYER INFORMATION -->
    <div class="player-info">

      <p class="player-name">
        {{ playerService.profile.username || 'Player' }}
      </p>

      <div class="xp-bar">
        <div class="xp-fill" [style.width.%]="playerService.profile.xp">
        </div>
      </div>

    </div>

    <!-- WORLD LEVEL -->
    <div class="world-level">

      <svg class="world-star" viewBox="0 0 100 100" aria-hidden="true">

        <!-- Progress points -->
        <ng-container *ngFor="let point of worldPoints">
          <circle class="world-point" [attr.cx]="point.x" [attr.cy]="point.y" [attr.r]="point.size">
          </circle>
        </ng-container>

        <!-- Four-point star: World Level 10+ -->
        <polygon *ngIf="worldTier === 1" class="world-star-shape"
          points="50,8 57,43 92,50 57,57 50,92 43,57 8,50 43,43">
        </polygon>

        <!-- Six-point star: World Level 20+ -->
        <polygon *ngIf="worldTier >= 2" class="world-star-shape" points="50,4 61,39 96,50 61,61 50,96 39,61 4,50 39,39">
        </polygon>

      </svg>

    </div>

  </div>

</button>
