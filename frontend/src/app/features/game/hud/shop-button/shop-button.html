
<div class="currency-control">

  <!-- ESTRELA + SALDO: ABRIR LOJA -->
  <button
    type="button"
    class="currency-shop-btn"
    routerLink="/shop"
    aria-label="Abrir loja"
  >

    <svg
      class="currency-star-system"
      viewBox="0 0 44 44"
      aria-hidden="true"
    >

      <!-- ÓRBITA -->
      <g class="currency-orbit-system">

        <ellipse
          class="currency-orbit"
          cx="22"
          cy="22"
          rx="19"
          ry="10"
        />

        <path
          class="currency-orbit-path"
          d="M41,22 A19,10 0 1,1 3,22
             A19,10 0 1,1 41,22"
        />

        <!-- PARTÍCULA ANIMADA -->
        <circle
          class="currency-companion"
          cx="0"
          cy="0"
          r="2"
        >
          <animateMotion
            dur="3s"
            repeatCount="indefinite"
            rotate="0"
            path="M41,22 A19,10 0 1,1 3,22
                  A19,10 0 1,1 41,22"
          />
        </circle>

      </g>

      <!-- ESTRELA ORIGINAL -->
      <path
        class="currency-star"
        d="
          M22,3
          C22.8,9 23.8,15 26.5,18.5
          C30,20 35,21 41,22
          C35,23 30,24 26.5,25.5
          C23.8,29 22.8,35 22,41
          C21.2,35 20.2,29 17.5,25.5
          C14,24 9,23 3,22
          C9,21 14,20 17.5,18.5
          C20.2,15 21.2,9 22,3
          Z
        "
      />

    </svg>

    <!-- CRÉDITOS ATUALIZADOS -->
    <span class="currency-amount">
      {{ playerService.credits() | number:'1.0-0' }}
    </span>

  </button>

  <!-- BOTÃO + : ABRIR A MESMA LOJA -->
  <button
    type="button"
    class="currency-add-btn"
    routerLink="/shop"
    aria-label="Abrir loja"
  >
    <span>+</span>
  </button>

</div>
