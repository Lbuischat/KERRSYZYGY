<div class="currency-control">

  <!-- CURRENCY / SHOP -->
  <button type="button" class="currency-shop-btn" routerLink="/shop" aria-label="Abrir loja">

    <svg class="currency-star-system" viewBox="0 0 44 44" aria-hidden="true">

      <!-- ORBIT -->
      <g class="currency-orbit-system">

        <ellipse class="currency-orbit" cx="22" cy="22" rx="19" ry="10" />

        <path class="currency-orbit-path" d="
                        M 41,22
                        A 19,10 0 1,1 3,22
                        A 19,10 0 1,1 41,22
                    " />

        <!-- ORBITING PARTICLE -->
        <circle class="currency-companion" cx="0" cy="0" r="2">
          <animateMotion dur="3s" repeatCount="indefinite" rotate="0" path="
                            M 41,22
                            A 19,10 0 1,1 3,22
                            A 19,10 0 1,1 41,22
                        " />
        </circle>

      </g>


      <!-- FOUR-POINT STAR -->
      <path class="currency-star" d="
        M 22,3

        C 22.8,9
          23.8,15
          26.5,18.5

        C 30,20
          35,21
          41,22

        C 35,23
          30,24
          26.5,25.5

        C 23.8,29
          22.8,35
          22,41

        C 21.2,35
          20.2,29
          17.5,25.5

        C 14,24
          9,23
          3,22

        C 9,21
          14,20
          17.5,18.5

        C 20.2,15
          21.2,9
          22,3

        Z
    " />


    </svg>


    <span class="currency-amount">
      1,250
    </span>

  </button>


  <!-- ADD CURRENCY -->
  <button type="button" class="currency-add-btn" aria-label="Obter mais moedas">
    <span>+</span>
  </button>

</div>
