<div
  class="relative min-h-screen w-full"

  [style.--sprite-skin]="spritePalette.skin"
  [style.--sprite-hair]="spritePalette.hair"
  [style.--sprite-outfit]="spritePalette.outfit"
  [style.--sprite-dark]="spritePalette.dark"
  [style.--sprite-accent]="spritePalette.accent"
  [style.--sprite-cape]="spritePalette.cape"
  [style.--sprite-eye]="spritePalette.eye"

  [style.--show-explorer]="isAccessory('explorer') ? 'inline' : 'none'"
  [style.--show-oracle]="isAccessory('oracle') ? 'inline' : 'none'"
  [style.--show-guardian]="isAccessory('guardian') ? 'inline' : 'none'"
  [style.--show-hunter]="isAccessory('hunter') ? 'inline' : 'none'"
  [style.--show-chrono]="isAccessory('chrono') ? 'inline' : 'none'"
>

  <!-- GAME WORLD -->
  <app-game-world
    #gameWorld
    (tutorialBoundary)="showTutorialMessage()"
    (playerAttacked)="onPlayerAttack()"
    (enemyDefeated)="onEnemyDefeated()"
    (berryGathered)="tutorial.onBerryGathered()"
  />

  <!-- HUD -->
  <app-hud
    (settingsOpen)="openSettings()"
    (inventoryOpen)="toggleInventory()"
  />

  <!-- TUTORIAL -->
  <app-tutorial
    #tutorial
    [player]="gameWorld?.player"
    (enemyStepStarted)="onTutorialEnemyStepStarted()"
  />

  <!-- INVENTORY -->
  @if (inventoryOpen && !focusService.session()) {
    <app-inventory
      (closeInventory)="toggleInventory()"
    />
  }

  <!-- TUTORIAL MESSAGE -->
  @if (tutorialMessageVisible && !focusService.session()) {
    <div
      class="pointer-events-none fixed inset-0 z-[9999] flex items-center justify-center"
    >
      <div class="tutorial-message">

        <div class="tutorial-message-line"></div>

        <div class="tutorial-message-content">
          <span class="tutorial-message-label">
            TUTORIAL
          </span>

          <h2>You can't leave yet.</h2>

          <p>
            Complete the tutorial before exploring beyond this area.
          </p>
        </div>

        <div class="tutorial-message-line"></div>

      </div>
    </div>
  }

  <!-- FOCUS MODE -->
  <app-focus-mode />

</div>
