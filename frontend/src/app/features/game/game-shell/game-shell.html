<div class="relative min-h-screen w-full">

  <app-game-world
    (tutorialBoundary)="showTutorialMessage()"
    (playerAttacked)="onPlayerAttack()"
    (enemyDefeated)="onEnemyDefeated()" />

  <app-hud (settingsOpen)="openSettings()" (inventoryOpen)="toggleInventory()" />

  <app-tutorial [player]="gameWorld?.player" />

  @if (inventoryOpen) {
  <app-inventory (closeInventory)="toggleInventory()" />
  }

  @if (tutorialMessageVisible) {
  <div class="pointer-events-none fixed inset-0 z-[9999] flex items-center justify-center">
    <div class="tutorial-message">

      <div class="tutorial-message-line"></div>

      <div class="tutorial-message-content">
        <span class="tutorial-message-label">
          TUTORIAL
        </span>

        <h2>
          You can't leave yet.
        </h2>

        <p>
          Complete the tutorial before exploring beyond this area.
        </p>
      </div>

      <div class="tutorial-message-line"></div>

    </div>
  </div>
  }

</div>
