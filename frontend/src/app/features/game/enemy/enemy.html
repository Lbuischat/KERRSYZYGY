<div
  #enemyRef
  class="enemy"
  [class.elite]="elite"
  [style.left.px]="x"
  [style.top.px]="y"
  [style.width.px]="size"
  [style.height.px]="size"
>
  <!-- Raio de detecção -->
  <div
    class="enemy-view-range"
    [class.detected]="isPlayerInView"
    [style.width.px]="viewRange * 2"
    [style.height.px]="viewRange * 2"
  ></div>

  <!-- Sprite do slime -->
  <img
    class="enemy-sprite"
    [src]="spritePath"
    [alt]="elite ? 'Slime alienígena elite' : 'Slime alienígena'"
    draggable="false"
  />

  <!-- Barra de vida -->
  <div class="health-container">
    <div
      class="health-bar"
      [style.width.%]="getHealthPercentage()"
    ></div>
  </div>

  <!-- Identificação do slime elite -->
  @if (elite) {
    <span class="elite-label">ELITE</span>
  }
</div>
